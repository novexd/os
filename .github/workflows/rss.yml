
name: RSS to Nerimity

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-to-nerimity
  cancel-in-progress: false

jobs:
  poll-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds and send updates
        id: rss
        env:
          NERIMITY_WEBHOOK: ${{ secrets.NERIMITY_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from pathlib import Path

          FEEDS = {
              "x_osugame": {
                  "url": "https://keep.md/api/x-rss/osugame.xml?content=posts",
                  "label": "@osugame on X",
                  "username": "osu! News",
                  "avatar_url": "https://pbs.twimg.com/profile_images/706741102120800256/xOf4lxBy_400x400.jpg",
              },
              "x_osu_SOTD": {
                  "url": "https://keep.md/api/x-rss/osu_SOTD.xml?content=posts",
                  "label": "@osu_SOTD on X",
                  "username": "osu! SOTD",
                  "avatar_url": "https://pbs.twimg.com/profile_images/1278305103963963393/Y6qHo5ZT_400x400.png",
              },
              "reddit_osugame": {
                  "url": "https://www.reddit.com/r/osugame/new/.rss?limit=100",
                  "label": "r/osugame",
                  "username": "r/osugame",
                  "avatar_url": "https://i.redd.it/n13pg82qpjd41.png",
              },
          }


          HISTORY_FILE = Path("last_seen.json")
          WEBHOOK = os.environ.get("NERIMITY_WEBHOOK")

          if not WEBHOOK:
              raise SystemExit("NERIMITY_WEBHOOK secret is missing")

          if HISTORY_FILE.exists():
              history = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
          else:
              history = {}

          def request(url, payload=None):
              headers = {
                  "User-Agent": "OsuFeedGrabberBot/1.0 (GitHub Actions RSS reader)",
                  "Accept": "application/json, application/rss+xml, application/atom+xml, application/xml",
              }

              if payload is not None:
                  headers["Content-Type"] = "application/json; charset=utf-8"

              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8") if payload is not None else None,
                  headers=headers,
                  method="POST" if payload is not None else "GET",
              )

              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response:
                          return response.read()
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          raise
                      print(f"HTTP {exc.code}; retrying...")
                  except (urllib.error.URLError, TimeoutError):
                      if attempt == 2:
                          raise
                      print("Connection failed; retrying...")

                  time.sleep(2 ** (attempt + 1))

          def parse_latest(xml_data):
              root = ET.fromstring(xml_data)
              atom_ns = "{http://www.w3.org/2005/Atom}"

              if root.tag == atom_ns + "feed":
                  entry = root.find(atom_ns + "entry")
                  if entry is None:
                      return None

                  title = entry.findtext(atom_ns + "title", default="New post")
                  guid = entry.findtext(atom_ns + "id")
                  link = ""

                  for element in entry.findall(atom_ns + "link"):
                      if element.get("rel", "alternate") == "alternate":
                          link = element.get("href", "")
                          break

              else:
                  entry = root.find("./channel/item")
                  if entry is None:
                      return None

                  title = entry.findtext("title", default="New post")
                  link = entry.findtext("link", default="")
                  guid = entry.findtext("guid") or link

              if not guid:
                  raise ValueError("Feed item has no ID or link")

              return guid, title, link

          def save_history():
              HISTORY_FILE.write_text(
                  json.dumps(history, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

          def send_post(name, feed, title, link):
              message = f"**New post from {feed['label']}**\n{title}\n\n{link}"
              request(WEBHOOK, {
                  "content": f"[r:1829648046925979648] {message}" if name != "reddit_osugame" else message,
                  "username": feed["username"],
                  "avatarUrl": feed["avatar_url"],
                  "silent": name == "reddit_osugame",
              })

          def looks_like_gameplay(title):
              # Conservative title-only heuristic; NOT a substitute for actual flair.
              import re
              t = title.casefold()
              # Score posts usually contain a player/beatmap and a score statistic.
              stats = (
                  r"\b\d[\d,.]*\s?pp\b",
                  r"\b\d{2,3}(?:\.\d+)?\s?%",
                  r"\b\d[\d,]*\s?(?:x|combo)\b",
                  r"\b(?:fc|ss|s rank|a rank|first pass|new top play|personal best|world record)\b",
                  r"\b(?:#1|rank\s?#\d+)\b",
              )
              score_context = (
                  r"\b(?:osu!|std|mania|taiko|catch|ctb|score|play|clear|pass|sightread|"
                  r"replay|leaderboard|map|beatmap|pp|accuracy|acc|combo|fc|dt|hd|hr|ez|fl)\b"
                  r"|\[[^\]]+\]"
              )
              # Strong score signatures or score stats plus relevant context.
              return bool(
                  re.search(r"\b\d[\d,.]*\s?pp\b", t)
                  or (any(re.search(p, t) for p in stats)
                      and re.search(score_context, t))
              )

          def check_reddit(name, feed):
              root = ET.fromstring(request(feed["url"]))
              atom = "{http://www.w3.org/2005/Atom}"
              if root.tag != atom + "feed":
                  raise ValueError("Expected Reddit Atom feed")

              posts = []
              for entry in root.findall(atom + "entry"):
                  guid = entry.findtext(atom + "id") or ""
                  title = entry.findtext(atom + "title", default="New post")
                  link = next((e.get("href", "") for e in entry.findall(atom + "link")
                               if e.get("rel", "alternate") == "alternate"), "")
                  if guid and link:
                      posts.append((guid, title, link))

              if not posts:
                  print("No Reddit posts")
                  return

              previous = history.get(name)
              if not previous:
                  history[name] = posts[0][0]
                  save_history()
                  print("Initialized Reddit checkpoint; no historical posts sent")
                  return

              unseen = []
              for post in posts:
                  if post[0] == previous:
                      break
                  unseen.append(post)
              else:
                  # Checkpoint may be older than 100 posts. Don't spam a backlog.
                  history[name] = posts[0][0]
                  save_history()
                  print("Previous post outside feed; reset checkpoint without backfill")
                  return

              sent = 0
              for guid, title, link in reversed(unseen):
                  if looks_like_gameplay(title):
                      send_post(name, feed, title, link)
                      sent += 1
                  history[name] = guid
                  save_history()
              print(f"Delivered {sent} likely gameplay posts; skipped {len(unseen)-sent} others")

          failures = []
          degraded_feeds = []

          for name, feed in FEEDS.items():
              print(f"\nChecking {name}...")
              try:
                  if name == "reddit_osugame":
                      check_reddit(name, feed)
                      continue

                  item = parse_latest(request(feed["url"]))
                  if item is None:
                      print("Feed contains no posts")
                      continue
                  guid, title, link = item
                  if history.get(name) == guid:
                      print("No new post")
                      continue
                  send_post(name, feed, title, link)
                  history[name] = guid
                  save_history()
                  print(f"Successfully delivered {name}")

              except urllib.error.HTTPError as exc:
                  # A missing optional third-party feed must not invalidate
                  # successful deliveries from the other sources.
                  if name.startswith("x_") and exc.code in (404, 410):
                      note = f"{name}: upstream X feed returned HTTP {exc.code}; no updates available"
                      print(f"WARNING: {note}")
                      print(f"::warning::{note}")
                      degraded_feeds.append(name)
                  else:
                      print(f"ERROR: {name}: HTTP {exc.code}: {exc.reason}")
                      failures.append(name)
              except Exception as exc:
                  print(f"ERROR: {name}: {type(exc).__name__}: {exc}")
                  failures.append(name)

          if degraded_feeds:
              print("\nUnavailable optional feeds: " + ", ".join(degraded_feeds))
              with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as summary:
                  summary.write("### Feed warnings\n")
                  for name in degraded_feeds:
                      summary.write(f"- {name}: upstream feed returned 404/410; no X update was delivered.\n")
          if failures:
              raise SystemExit("Failed feeds: " + ", ".join(failures))

          print("\nFeed poll finished; successful sources processed (check warnings above).")
          PY

      - name: Commit tracking history
        if: always()
        run: |
          if [ ! -f last_seen.json ]; then
            echo "No history file to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_seen.json

          if git diff --cached --quiet; then
            echo "No history changes."
            exit 0
          fi

          git commit -m "Update RSS tracking history [skip ci]"
          git push
