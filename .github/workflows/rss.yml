
name: RSS to Nerimity

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-to-nerimity
  cancel-in-progress: false

jobs:
  poll-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds and send updates
        id: rss
        env:
          NERIMITY_WEBHOOK: ${{ secrets.NERIMITY_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from pathlib import Path

          FEEDS = {
              "x_osugame": {
                  "url": "https://keep.md/api/x-rss/osugame.xml?content=posts",
                  "label": "@osugame on X",
                  "username": "osu! News",
                  "avatar_url": "https://pbs.twimg.com/profile_images/706741102120800256/xOf4lxBy_400x400.jpg",
              },
              "x_osu_SOTD": {
                  "url": "https://keep.md/api/x-rss/osu_SOTD.xml?content=posts",
                  "label": "@osu_SOTD on X",
                  "username": "osu! SOTD",
                  "avatar_url": "https://pbs.twimg.com/profile_images/1278305103963963393/Y6qHo5ZT_400x400.png",
              },
              "reddit_osugame": {
                  "url": "https://www.reddit.com/r/osugame/search.xml?q=flair%3A%22Gameplay%22&restrict_sr=1&sort=new&t=all",
                  "label": "r/osugame",
                  "username": "r/osugame",
                  "avatar_url": "https://i.redd.it/n13pg82qpjd41.png",
              },
          }


          HISTORY_FILE = Path("last_seen.json")
          WEBHOOK = os.environ.get("NERIMITY_WEBHOOK")

          if not WEBHOOK:
              raise SystemExit("NERIMITY_WEBHOOK secret is missing")

          if HISTORY_FILE.exists():
              history = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
          else:
              history = {}

          def request(url, payload=None):
              headers = {
                  "User-Agent": "OsuFeedGrabberBot/1.0 (GitHub Actions RSS reader)",
                  "Accept": "application/json, application/rss+xml, application/atom+xml, application/xml",
              }

              if payload is not None:
                  headers["Content-Type"] = "application/json; charset=utf-8"

              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8") if payload is not None else None,
                  headers=headers,
                  method="POST" if payload is not None else "GET",
              )

              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response:
                          return response.read()
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          raise
                      print(f"HTTP {exc.code}; retrying...")
                  except (urllib.error.URLError, TimeoutError):
                      if attempt == 2:
                          raise
                      print("Connection failed; retrying...")

                  time.sleep(2 ** (attempt + 1))

          def parse_latest(xml_data):
              root = ET.fromstring(xml_data)
              atom_ns = "{http://www.w3.org/2005/Atom}"

              if root.tag == atom_ns + "feed":
                  entry = root.find(atom_ns + "entry")
                  if entry is None:
                      return None

                  title = entry.findtext(atom_ns + "title", default="New post")
                  guid = entry.findtext(atom_ns + "id")
                  link = ""

                  for element in entry.findall(atom_ns + "link"):
                      if element.get("rel", "alternate") == "alternate":
                          link = element.get("href", "")
                          break

              else:
                  entry = root.find("./channel/item")
                  if entry is None:
                      return None

                  title = entry.findtext("title", default="New post")
                  link = entry.findtext("link", default="")
                  guid = entry.findtext("guid") or link

              if not guid:
                  raise ValueError("Feed item has no ID or link")

              return guid, title, link

          def save_history():
              HISTORY_FILE.write_text(
                  json.dumps(history, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

          def send_post(name, feed, title, link):
              message = f"**New post from {feed['label']}**\n{title}\n\n{link}"
              request(WEBHOOK, {
                  "content": f"[r:1829648046925979648] {message}" if name != "reddit_osugame" else message,
                  "username": feed["username"],
                  "avatarUrl": feed["avatar_url"],
                  "silent": name == "reddit_osugame",
              })

          def check_reddit(name, feed):
              # Reddit's native search feed filters by actual post flair.
              # Its Atom entries generally do not expose flair metadata.
              root = ET.fromstring(request(feed["url"]))
              atom = "{http://www.w3.org/2005/Atom}"
              if root.tag != atom + "feed":
                  raise ValueError("Expected Reddit Atom search feed")

              posts = []
              for entry in root.findall(atom + "entry"):
                  guid = entry.findtext(atom + "id") or ""
                  title = entry.findtext(atom + "title", default="New post")
                  link = next((e.get("href", "") for e in entry.findall(atom + "link")
                               if e.get("rel", "alternate") == "alternate"), "")
                  if not guid or not link:
                      continue
                  posts.append((guid, title, link))

              if not posts:
                  print("No Gameplay posts in search feed")
                  return

              def normalized_id(value):
                  # Atom IDs are usually t3_...; handle full URLs too.
                  import re
                  match = re.search(r"(t3_[a-z0-9]+)", value or "", re.I)
                  if match:
                      return match.group(1).lower()
                  match = re.search(r"/comments/([a-z0-9]+)", value or "", re.I)
                  return "t3_" + match.group(1).lower() if match else value

              previous = history.get(name)
              previous_id = normalized_id(previous)
              # First run with no checkpoint: seed without reposting old entries.
              if not previous:
                  history[name] = normalized_id(posts[0][0])
                  save_history()
                  print("Initialized Gameplay checkpoint; no historical posts sent")
                  return

              unseen = []
              for post in posts:
                  if normalized_id(post[0]) == previous_id:
                      break
                  unseen.append(post)
              else:
                  # The old checkpoint may refer to a non-Gameplay post, or be
                  # outside the search feed. Seed safely to avoid a flood.
                  history[name] = normalized_id(posts[0][0])
                  save_history()
                  print("Checkpoint not in Gameplay feed; reseeded without backfill")
                  return

              for guid, title, link in reversed(unseen):
                  send_post(name, feed, title, link)
                  history[name] = normalized_id(guid)
                  save_history()
              print(f"Delivered {len(unseen)} new Gameplay posts")

          failures = []

          for name, feed in FEEDS.items():
              print(f"\nChecking {name}...")
              try:
                  if name == "reddit_osugame":
                      check_reddit(name, feed)
                      continue

                  item = parse_latest(request(feed["url"]))
                  if item is None:
                      print("Feed contains no posts")
                      continue
                  guid, title, link = item
                  if history.get(name) == guid:
                      print("No new post")
                      continue
                  send_post(name, feed, title, link)
                  history[name] = guid
                  save_history()
                  print(f"Successfully delivered {name}")

              except Exception as exc:
                  print(f"ERROR: {name}: {type(exc).__name__}: {exc}")
                  failures.append(name)

          if failures:
              raise SystemExit(
                  "Failed feeds: " + ", ".join(failures)
              )

          print("\nAll feeds checked successfully")
          PY

      - name: Diagnose Reddit Atom metadata (no webhook posts)
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          url = "https://www.reddit.com/r/osugame/new/.rss?limit=100"
          req = urllib.request.Request(url, headers={
              "User-Agent": "OsuFeedGrabberBot/1.0 (RSS metadata diagnostic)",
              "Accept": "application/atom+xml, application/xml",
          })
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  print("HTTP status:", response.status)
                  data = response.read()
              root = ET.fromstring(data)
              atom = "{http://www.w3.org/2005/Atom}"
              entries = root.findall(atom + "entry")
              print("Atom entries:", len(entries))
              for entry in entries[:8]:
                  title = entry.findtext(atom + "title", default="")
                  guid = entry.findtext(atom + "id", default="")
                  categories = [e.attrib for e in entry.findall(atom + "category")]
                  print("Post:", guid, "| title:", title[:100], "| categories:", categories)
              if entries:
                  print("First entry child tags:", [e.tag for e in entries[0]])
              # Inspect HTML content for flair markers, without printing entire posts.
              import html
              import re
              for entry in entries[:30]:
                  guid = entry.findtext(atom + "id", default="")
                  raw = entry.findtext(atom + "content", default="")
                  decoded = html.unescape(raw)
                  terms = re.findall(r".{0,70}(?:gameplay|flair).{0,100}", decoded, flags=re.I)
                  print("Content metadata:", guid, "| matches:", [x[:170] for x in terms[:4]])
              print("NOTE: Content text matches alone do not prove post flair.")
              print("NOTE: No Nerimity webhook calls in this diagnostic step.")
          except (urllib.error.URLError, ET.ParseError, TimeoutError) as exc:
              print("RSS diagnostic unavailable:", type(exc).__name__, str(exc))
          PY

      - name: Commit tracking history
        if: always()
        run: |
          if [ ! -f last_seen.json ]; then
            echo "No history file to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_seen.json

          if git diff --cached --quiet; then
            echo "No history changes."
            exit 0
          fi

          git commit -m "Update RSS tracking history [skip ci]"
          git push
